<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alışkanlık Takip Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .check-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .check-btn:active { transform: scale(0.85); }
        .bar-fill { transition: height 0.5s ease-out, background-color 0.3s ease; }
        .toast-enter { transform: translateY(0); opacity: 1; }
        .toast-exit { transform: translateY(1rem); opacity: 0; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Üst Başlık, Özet İstatistikler ve Yedekleme Araçları -->
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-slate-800/80 border border-slate-700 p-6 rounded-2xl shadow-lg gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span>🎯</span> Haftalık Alışkanlık ve Seri Paneli
                </h1>
                <p id="currentDateText" class="text-slate-400 text-sm mt-1"></p>
            </div>

            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-between lg:justify-end">
                <!-- İstatistik Kartları -->
                <div class="flex gap-3 flex-1 sm:flex-none">
                    <div class="bg-slate-900/90 border border-slate-700/80 px-4 py-2.5 rounded-xl flex-1 sm:flex-none text-center">
                        <span class="text-[11px] text-slate-400 block">Haftalık Başarı</span>
                        <span id="weeklyRate" class="text-lg font-bold text-emerald-400">0%</span>
                    </div>
                    <div class="bg-slate-900/90 border border-slate-700/80 px-4 py-2.5 rounded-xl flex-1 sm:flex-none text-center">
                        <span class="text-[11px] text-slate-400 block">En Uzun Seri</span>
                        <span id="bestStreak" class="text-lg font-bold text-amber-400">🔥 0</span>
                    </div>
                </div>

                <!-- JSON Dışa / İçe Aktarma Butonları -->
                <div class="flex gap-2 w-full sm:w-auto border-t sm:border-t-0 border-slate-700 pt-3 sm:pt-0">
                    <button onclick="exportData()" title="Verileri JSON dosyası olarak indir"
                        class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium px-3.5 py-2.5 rounded-xl border border-slate-600 transition cursor-pointer">
                        <span>📥</span> Dışa Aktar
                    </button>
                    <button onclick="triggerImport()" title="JSON yedek dosyasını yükle"
                        class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium px-3.5 py-2.5 rounded-xl border border-slate-600 transition cursor-pointer">
                        <span>📤</span> İçe Aktar
                    </button>
                    <!-- Gizli Dosya Seçici -->
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                </div>
            </div>
        </header>

        <!-- Yeni Alışkanlık Ekleme Formu -->
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-2xl flex flex-col sm:flex-row gap-3">
            <input type="text" id="habitInput" placeholder="Yeni bir günlük hedef ekle (Örn: 2 Litre Su İç, 30 Dk Kitap Oku)..." 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            <button onclick="addHabit()" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition cursor-pointer shrink-0">
                + Hedef Ekle
            </button>
        </div>

        <!-- Ana İçerik: Tablo ve Grafik -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Sol: Haftalık Alışkanlık Tablosu (2 Sütun Genişliğinde) -->
            <div class="lg:col-span-2 bg-slate-800/80 border border-slate-700 rounded-2xl p-6 overflow-x-auto">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">Günlük Hedef Çizelgesi</h2>
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase">
                            <th class="pb-3 font-medium">Hedef</th>
                            <th class="pb-3 font-medium text-center">Pzt</th>
                            <th class="pb-3 font-medium text-center">Sal</th>
                            <th class="pb-3 font-medium text-center">Çar</th>
                            <th class="pb-3 font-medium text-center">Per</th>
                            <th class="pb-3 font-medium text-center">Cum</th>
                            <th class="pb-3 font-medium text-center">Cmt</th>
                            <th class="pb-3 font-medium text-center">Paz</th>
                            <th class="pb-3 font-medium text-center">Seri</th>
                            <th class="pb-3 font-medium text-right">Sil</th>
                        </tr>
                    </thead>
                    <tbody id="habitList" class="divide-y divide-slate-700/60 text-sm">
                        <!-- JS ile doldurulacak -->
                    </tbody>
                </table>
            </div>

            <!-- Sağ: Haftalık Seri ve Tamamlanma Grafiği -->
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200">Haftalık Performans Grafiği</h2>
                    <p class="text-xs text-slate-400 mt-1">Gün bazında tamamlanan hedef oranı</p>
                </div>

                <!-- Sütun Grafiği Alanı -->
                <div id="chartContainer" class="grid grid-cols-7 gap-2 items-end h-52 pt-8 pb-2 border-b border-slate-700 my-4">
                    <!-- JS ile dinamik barlar gelecek -->
                </div>

                <div class="flex justify-between items-center text-xs text-slate-400">
                    <span>💡 İpucu: Kutucuklara tıklayarak durumu değiştirin.</span>
                    <button onclick="resetWeek()" class="text-rose-400 hover:underline cursor-pointer">Haftayı Sıfırla</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bildirim (Toast) Kutusu -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-slate-600 text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transition-all duration-300 toast-exit pointer-events-none">
        Bildirim mesajı
    </div>

    <script>
        const days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
        
        // Varsayılan başlangıç verileri
        let habits = JSON.parse(localStorage.getItem('habits_data')) || [
            { id: 1, name: '💧 2.5 Litre Su İç', completed: [true, true, true, false, false, false, false] },
            { id: 2, name: '📚 25 Sayfa Kitap Oku', completed: [true, false, true, true, false, false, false] },
            { id: 3, name: '🏃‍♂️ 30 Dk Yürüyüş / Antrenman', completed: [false, true, true, true, false, false, false] },
            { id: 4, name: '🧘‍♂️ Şekersiz Beslenme', completed: [true, true, false, false, false, false, false] }
        ];

        // Tarihi Göster
        const now = new Date();
        document.getElementById('currentDateText').innerText = now.toLocaleDateString('tr-TR', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `fixed bottom-5 right-5 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transition-all duration-300 toast-enter ${
                isError ? 'bg-rose-950 border border-rose-700 text-rose-200' : 'bg-emerald-950 border border-emerald-700 text-emerald-200'
            }`;
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
            }, 3000);
        }

        function saveData() {
            localStorage.setItem('habits_data', JSON.stringify(habits));
        }

        // --- JSON DIŞA AKTARMA (EXPORT) ---
        function exportData() {
            const dataStr = JSON.stringify(habits, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const dateStamp = new Date().toISOString().slice(0, 10);
            const a = document.createElement('a');
            a.href = url;
            a.download = `aliskanlik-yedek-${dateStamp}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('✅ Yedek dosyası başarıyla indirildi!');
        }

        // --- JSON İÇE AKTARMA (IMPORT) ---
        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    // Veri formatı doğrulama (Validation)
                    const isValid = Array.isArray(importedData) && importedData.every(item => 
                        typeof item.id !== 'undefined' &&
                        typeof item.name === 'string' &&
                        Array.isArray(item.completed) &&
                        item.completed.length === 7
                    );

                    if (!isValid) {
                        throw new Error('Geçersiz dosya yapısı.');
                    }

                    habits = importedData;
                    saveData();
                    render();
                    showToast('🎉 Veriler başarıyla içe aktarıldı!');
                } catch (err) {
                    showToast('❌ Hata: Geçersiz veya bozuk JSON dosyası!', true);
                } finally {
                    // Aynı dosyayı tekrar seçebilmek için input'u sıfırla
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        // Kesintisiz seri hesaplama
        function calculateStreak(completedArray) {
            let currentStreak = 0;
            let maxStreak = 0;
            for (let status of completedArray) {
                if (status) {
                    currentStreak++;
                    if (currentStreak > maxStreak) maxStreak = currentStreak;
                } else {
                    currentStreak = 0;
                }
            }
            return maxStreak;
        }

        function toggleDay(habitId, dayIndex) {
            const habit = habits.find(h => h.id === habitId);
            if (habit) {
                habit.completed[dayIndex] = !habit.completed[dayIndex];
                saveData();
                render();
            }
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const name = input.value.trim();
            if (!name) return;

            habits.push({
                id: Date.now(),
                name: name,
                completed: [false, false, false, false, false, false, false]
            });

            input.value = '';
            saveData();
            render();
            showToast('✨ Yeni hedef eklendi!');
        }

        function deleteHabit(habitId) {
            habits = habits.filter(h => h.id !== habitId);
            saveData();
            render();
        }

        function resetWeek() {
            if (confirm('Bu haftanın tüm işaretlemelerini sıfırlamak istediğinize emin misiniz?')) {
                habits.forEach(h => h.completed = [false, false, false, false, false, false, false]);
                saveData();
                render();
                showToast('🔄 Haftalık çizelge sıfırlandı.');
            }
        }

        function render() {
            const listEl = document.getElementById('habitList');
            const chartEl = document.getElementById('chartContainer');
            listEl.innerHTML = '';
            chartEl.innerHTML = '';

            let totalChecks = 0;
            let bestOverallStreak = 0;

            // 1. Tabloyu Oluştur
            habits.forEach(habit => {
                const streak = calculateStreak(habit.completed);
                if (streak > bestOverallStreak) bestOverallStreak = streak;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition';
                
                let daysHtml = '';
                habit.completed.forEach((done, idx) => {
                    if (done) totalChecks++;
                    daysHtml += `
                        <td class="py-3.5 text-center">
                            <button onclick="toggleDay(${habit.id}, ${idx})" 
                                class="check-btn w-7 h-7 rounded-lg inline-flex items-center justify-center border cursor-pointer ${
                                    done 
                                    ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-bold shadow-sm shadow-emerald-500/30' 
                                    : 'bg-slate-900 border-slate-700 text-transparent hover:border-slate-500'
                                }">
                                ✓
                            </button>
                        </td>
                    `;
                });

                tr.innerHTML = `
                    <td class="py-3.5 pr-4 font-medium text-slate-200">${habit.name}</td>
                    ${daysHtml}
                    <td class="py-3.5 text-center font-semibold text-amber-400">🔥 ${streak}</td>
                    <td class="py-3.5 text-right">
                        <button onclick="deleteHabit(${habit.id})" class="text-slate-500 hover:text-rose-400 transition px-1 cursor-pointer">✕</button>
                    </td>
                `;
                listEl.appendChild(tr);
            });

            // 2. Üst İstatistikleri Güncelle
            const totalPossible = habits.length * 7;
            const weeklyPercentage = totalPossible > 0 ? Math.round((totalChecks / totalPossible) * 100) : 0;
            document.getElementById('weeklyRate').innerText = `${weeklyPercentage}%`;
            document.getElementById('bestStreak').innerText = `🔥 ${bestOverallStreak} Gün`;

            // 3. Haftalık Grafiği Oluştur
            days.forEach((dayName, dayIdx) => {
                let completedOnDay = 0;
                habits.forEach(h => {
                    if (h.completed[dayIdx]) completedOnDay++;
                });

                const pct = habits.length > 0 ? Math.round((completedOnDay / habits.length) * 100) : 0;
                const barColor = pct === 100 ? 'bg-emerald-400' : pct >= 50 ? 'bg-indigo-500' : 'bg-slate-600';

                const col = document.createElement('div');
                col.className = 'flex flex-col items-center h-full justify-end group';
                col.innerHTML = `
                    <span class="text-[11px] font-medium text-slate-400 mb-1 opacity-80 group-hover:opacity-100">${pct}%</span>
                    <div class="w-full bg-slate-900 rounded-t-lg h-36 flex items-end p-1 border border-slate-700/60">
                        <div class="bar-fill w-full rounded-t-md ${barColor}" style="height: ${Math.max(pct, 6)}%"></div>
                    </div>
                    <span class="text-xs text-slate-300 mt-2 font-medium">${dayName}</span>
                `;
                chartEl.appendChild(col);
            });
        }

        // Enter tuşu ile alışkanlık ekleme desteği
        document.getElementById('habitInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addHabit();
        });

        // İlk yükleme
        render();
    </script>
</body>
</html>
